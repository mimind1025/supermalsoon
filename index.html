<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>슈퍼말순TV 공식 홈페이지</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 상단 브랜드 헤더 -->
  <header class="site-header">
    <div class="site-header-inner">
      <a href="#home" class="brand" data-scroll>슈퍼말순<span>TV</span></a>

      <nav class="main-nav" aria-label="주요 메뉴">
        <a href="#home" data-scroll>홈</a>
        <a href="#contentSection" data-scroll data-filter="all">이모티콘</a>
        <a href="#contentSection" data-scroll data-filter="gif">움짤</a>
        <a href="#contentSection" data-scroll data-filter="video">영상</a>
        <a href="#guestbookSection" data-scroll>방명록</a>
      </nav>

      <button type="button" class="btn-kakao" disabled>
        <span class="kakao-icon" aria-hidden="true">💬</span>
        <span class="kakao-text">카카오로 시작하기</span>
        <span class="badge-soon">준비중</span>
      </button>
    </div>
  </header>

  <main>
    <!-- HERO -->
    <section id="home" class="hero">
      <div class="hero-inner">
        <div class="hero-text">
          <p class="hero-badge">슈퍼말순 공식 홈페이지</p>
          <h1 class="hero-title">말순이네<br />놀러오셨네여</h1>
          <p class="hero-sub">언니오빠들 쓰라고 이것저것<br />챙겨놨어여 ♡</p>
          <button type="button" id="heroCta" class="btn btn-primary hero-cta">
            무료 이모티콘 보러가기
          </button>
        </div>

        <div class="hero-image-wrap">
          <div class="hero-speech-bubble">놀러왔어영? 🐣</div>
          <div class="hero-image">
            <span class="placeholder-text">🐣<br />말순이 대표 이미지<br />(준비중)</span>
            <!-- 실제 이미지 준비되면 images/malsoon-main.png 로 자동 표시됩니다 -->
            <!-- Supabase 연결 후에는 admin.html에서 등록한 이미지로 JS가 src를 교체합니다 -->
            <img src="images/malsoon-main.png" alt="슈퍼말순 대표 이미지" onerror="this.style.display='none'" />
          </div>
        </div>
      </div>
    </section>

    <!-- 카테고리 -->
    <section class="section category-section">
      <h2 class="section-title">뭐부터 챙겨갈까요?</h2>
      <p class="section-sub">말순이가 챙겨온 콘텐츠들이에여</p>

      <div class="category-grid">
        <button type="button" class="category-card" data-filter="holiday">
          <div class="category-image">
            <span class="placeholder-text small">🎉</span>
            <img src="images/category-holiday.png" alt="명절 이모티콘" onerror="this.remove()" />
          </div>
          <h3 class="category-title">명절 이모티콘</h3>
          <p class="category-desc">명절마다 꺼내쓰는 말순이 인사 모음</p>
        </button>

        <button type="button" class="category-card" data-filter="gif">
          <div class="category-image">
            <span class="placeholder-text small">✨</span>
            <img src="images/category-gif.png" alt="말순이 일상 움짤" onerror="this.remove()" />
          </div>
          <h3 class="category-title">말순이 일상 움짤</h3>
          <p class="category-desc">카톡에 슬쩍 던지기 좋은 말순이 리액션</p>
        </button>

        <button type="button" class="category-card" data-filter="video">
          <div class="category-image">
            <span class="placeholder-text small">🎬</span>
            <img src="images/category-video.png" alt="말순이 영상" onerror="this.remove()" />
          </div>
          <h3 class="category-title">말순이 영상</h3>
          <p class="category-desc">고화질로 소장하는 말순이 짧은 영상</p>
        </button>
      </div>
    </section>

    <!-- 콘텐츠 카드 -->
    <section id="contentSection" class="section emoji-section">
      <div class="section-title-row">
        <div class="section-title-deco">
          <img src="images/malsoon-icon.png" alt="" onerror="this.parentElement.style.display='none'" />
        </div>
        <div>
          <h2 class="section-title">말순이 무료 콘텐츠</h2>
          <p class="section-sub">언니오빠들 쓰라고 말순이가 챙겨왔어여 ♡</p>
        </div>
      </div>

      <div class="filter-tabs" id="filterTabs">
        <button type="button" class="filter-tab active" data-filter="all">전체</button>
        <button type="button" class="filter-tab" data-filter="holiday">명절 이모티콘</button>
        <button type="button" class="filter-tab" data-filter="gif">움짤</button>
        <button type="button" class="filter-tab" data-filter="video">영상</button>
      </div>

      <!-- 콘텐츠 카드는 script.js의 contents 배열을 읽어 자동으로 채워집니다 -->
      <div id="contentList" class="emoji-set-list"></div>
    </section>

    <!-- 다운로드 전 구독 팝업 -->
    <div id="subscribeModal" class="modal-overlay">
      <div class="modal-box">
        <p class="modal-title">잠깐만여 ✋</p>
        <p class="modal-text">말순이가 공짜로 챙겨드리는 거니까</p>
        <p class="modal-text">슈퍼말순TV 구독 한번만 부탁드려여 ♡</p>
        <div class="modal-buttons">
          <button id="goSubscribeBtn" class="btn btn-secondary">유튜브 구독하러 가기</button>
          <button id="goKakaoChannelBtn" class="btn btn-secondary">말순이 카카오채널 친구추가</button>
          <button id="confirmDownloadBtn" class="btn btn-primary">이미 했어여 → 다운로드</button>
        </div>
      </div>
    </div>

    <!-- 콘텐츠 미리보기 팝업 (이미지 / 추후 GIF·MP4 대응) -->
    <div id="previewModal" class="modal-overlay">
      <div class="modal-box preview-box">
        <button id="closePreviewBtn" class="preview-close" aria-label="닫기">×</button>
        <div id="previewMedia" class="preview-media"></div>
        <p id="previewTitle" class="preview-title"></p>
      </div>
    </div>

    <!-- 방명록 -->
    <section id="guestbookSection" class="section guestbook-section">
      <div class="guestbook-header">
        <div>
          <h2 class="section-title">말순이네 방명록</h2>
          <p class="section-sub">왔다갔으면 한마디 정도는 남겨주고 가세여 😐</p>
        </div>
        <div class="guestbook-character">
          <img src="images/malsoon-guestbook.png" alt="" onerror="this.parentElement.style.display='none'" />
        </div>
      </div>

      <div id="guestbookNotice" class="guestbook-notice" hidden></div>

      <form id="guestbookForm" class="guestbook-form">
        <input
          type="text"
          id="nickname"
          placeholder="닉네임"
          maxlength="20"
          autocomplete="off"
          required
        />
        <textarea
          id="message"
          placeholder="한마디 남겨주세여"
          maxlength="150"
          rows="3"
          required
        ></textarea>
        <button type="submit" id="submitBtn" class="btn btn-primary">남기기</button>
      </form>

      <ul id="guestbookList" class="guestbook-list"></ul>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-character">
      <img src="images/malsoon-footer.png" alt="" onerror="this.parentElement.style.display='none'" />
    </div>
    <p>ⓒ 슈퍼말순TV</p>
  </footer>

  <!-- Supabase 클라이언트 (방명록 / 콘텐츠 / HERO 설정 조회용) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="script.js"></script>
</body>
</html>
